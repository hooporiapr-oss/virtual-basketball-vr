<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dynamic Basketball · Access</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;color:#fff;
    background:#000;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }

  #stage{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:#000;
  }

  #panel{width:100%;max-width:400px;text-align:center}
  .sub{font-size:.85rem;color:#9fb3c8;letter-spacing:.02em;margin-bottom:44px}

  .code-panel{width:100%}
  .code-label{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8892a0;margin-bottom:10px}
  .code-input{
    width:100%;padding:16px;border-radius:12px;border:2px solid rgba(124,58,237,.4);
    background:rgba(255,255,255,.05);color:#fff;font-size:1.4rem;font-weight:900;
    letter-spacing:.25em;text-transform:uppercase;text-align:center;font-family:'Courier New',monospace;
  }
  .code-input:focus{outline:none;border-color:#7c3aed;box-shadow:0 0 24px rgba(124,58,237,.35)}
  .code-input.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .enter-btn{
    width:100%;margin-top:16px;padding:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;
    font-size:1rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 0 30px rgba(124,58,237,.5);
  }
  .enter-btn:active{transform:scale(.98)}

  .err{margin-top:14px;color:#ff8888;font-size:.85rem;font-weight:700;min-height:18px}

  .brandmark{margin-top:50px;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4a5058}
  .brandmark b{color:#8892a0;font-style:italic}

  .gate-title{font-size:1.8rem;font-weight:900;font-style:italic;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 30px rgba(124,58,237,.6)}
  .gate-title span{color:#7c3aed}
  @media(max-width:480px){ .gate-title{font-size:1.35rem} }
</style>
</head>
<body>

<div id="stage">
  <div id="panel">
    <div class="gate-title">DYNAMIC <span>BASKETBALL</span></div>
    <div class="sub">Enter Your Access Code</div>

    <div class="code-panel">
      <div class="code-label">Access Code</div>
      <input class="code-input" id="gate-code" maxlength="40" placeholder="• • • •" autocomplete="off" onkeydown="if(event.key==='Enter')tryEnter()">
      <button class="enter-btn" onclick="tryEnter()">Enter Dynamic Basketball →</button>
      <div class="err" id="gate-err"></div>
    </div>

    <div class="brandmark">Powered by <a href="https://gostardigital.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline"><b>Gostar Digital</b></a></div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  LICENSE SYSTEM — this is its own separate repo, so it uses
//  its own distinct session key ('dynamic-basketball-gate-pass') and its
//  own distinct product scope ('dynamic-basketball') in the SAME Supabase
//  licenses table every other product already uses. A code
//  issued for BPM Basketball, Ritnome, Hooporia, or Never Miss A
//  Shot will NOT unlock this gate, and vice versa, even though
//  all five live in the same table. To issue / expire / revoke
//  Dynamic Basketball licenses, admin.html has a matching product tab for
//  'dynamic-basketball'.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var PRODUCT = 'dynamic-basketball';
// ══════════════════════════════════════════════════════

function tryEnter(){
  var input = $('gate-code').value.trim();
  if (!input){ return; }
  $('gate-err').style.color = '';
  $('gate-err').textContent = 'Checking…';

  var url = SUPABASE_URL + '/rest/v1/licenses'
    + '?select=code,expires_at,active,product'
    + '&code=ilike.' + encodeURIComponent(input)
    + '&active=eq.true'
    + '&product=eq.' + PRODUCT;

  fetch(url, {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    var lic = (rows && rows.length) ? rows[0] : null;

    if (!lic){ return reject('Invalid code — check with your administrator'); }

    if (lic.expires_at){
      var exp = new Date(lic.expires_at + 'T23:59:59');
      if (new Date() > exp){ return reject('This license has expired'); }
    }

    sessionStorage.setItem('dynamic-basketball-gate-pass','1');
    sessionStorage.setItem('dynamic-basketball-license', input.toUpperCase());
    window.location.href = 'vr-the-handle.html';
  })
  .catch(function(){
    reject('Connection problem — please try again');
  });
}

function reject(msg){
  $('gate-err').style.color = '#ff8888';
  $('gate-err').textContent = msg;
  var box = $('gate-code');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  box.value=''; box.focus();
}

// No auto-focus on load — in VR, focusing an input field automatically
// can trigger the headset's own virtual keyboard or a browser UI
// reflow, a plausible source of the panel destabilizing right as the
// page appears. Focus only happens now in response to a genuine user
// action (a rejected code), never automatically.
</script>
</body>
</html>
