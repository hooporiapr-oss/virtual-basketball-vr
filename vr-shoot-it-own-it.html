<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (sessionStorage.getItem('dynamic-basketball-gate-pass') !== '1') {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHOOT IT. OWN IT. | Dynamic Basketball</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#space{position:fixed;inset:0;background:#000;overflow:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#edge-glow{position:fixed;inset:0;pointer-events:none;z-index:1;display:none}
#flash{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .1s}
#flash.buzzer{transition:opacity .35s ease-out}
body.buzzer-shake{animation:buzzerShake .5s cubic-bezier(.36,.07,.19,.97) 2}
@keyframes buzzerShake{
  0%,100%{transform:translate(0,0)}
  10%{transform:translate(-6px,-4px)}
  20%{transform:translate(7px,3px)}
  30%{transform:translate(-8px,4px)}
  40%{transform:translate(6px,-3px)}
  50%{transform:translate(-5px,3px)}
  60%{transform:translate(5px,-4px)}
  70%{transform:translate(-4px,2px)}
  80%{transform:translate(4px,-2px)}
  90%{transform:translate(-2px,1px)}
}

#topClock{position:fixed;top:0;left:0;right:0;z-index:21;text-align:center;padding:10px 22px 4px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent)}
#topClock .clock-label{font-size:.5rem;color:#ffd35a;font-weight:900;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1px}
#topClock .clock-val{font-size:2.6rem;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 20px rgba(255,211,90,.6)}
#topClock .clock-val.urgent{color:#FF1493;text-shadow:0 0 24px rgba(255,20,147,.8);animation:clockPulse .5s ease-in-out infinite}
@keyframes clockPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#hud{position:fixed;top:78px;left:0;right:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:0 22px 10px}
.hud-box{text-align:center}
.hud-label{font-size:.5rem;color:#7c3aed;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.hud-val{font-size:2rem;font-weight:900;line-height:1}
#hScore{color:#fff;font-size:2.6rem}#hLastMs{color:#ffd35a}#hBest{font-size:1.3rem;color:#9fb3c8}

#msg{position:fixed;top:16%;left:50%;transform:translate(-50%,0);z-index:20;font-size:1.5rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;text-align:center;pointer-events:none;text-shadow:0 0 30px currentColor;transition:opacity .3s}
#msg.watch{color:#7c3aed}#msg.go{color:#ffd35a}#msg.correct{color:#00D9A5}#msg.wrong{color:#FF1493}

/* stimulus stage — the ball flashes once at a random static spot, no
   wandering, then vanishes to a blank screen while awaiting the tap. */
#stage{position:fixed;top:10%;bottom:34%;left:0;right:0;z-index:12}
#stimulus{
  position:absolute;top:50%;width:110px;height:110px;border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  transition:transform .08s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;justify-content:center;
  font-size:3.2rem;color:#fff;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.6),0 0 4px rgba(0,0,0,.5);
  background:
    url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2249%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%20fill%3D%22none%22%20stroke%3D%22%23231005%22%20stroke-width%3D%223.4%22%3E%3Cline%20x1%3D%2250%22%20y1%3D%22-4%22%20x2%3D%2250%22%20y2%3D%22104%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20-4%20104%2050%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20104%20104%2050%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2224%22%20ry%3D%2249%22/%3E%3C/g%3E%3C/svg%3E'),
    radial-gradient(circle at 35% 32%,#ffb35c,#ff8c00 55%,#d9660a 85%);
  background-size:100% 100%,100% 100%;
  box-shadow:0 0 40px rgba(255,140,0,.85),0 0 80px rgba(255,140,0,.45);
}
#stimulus.visible{transform:translate(-50%,-50%) scale(1)}

.ripple{position:fixed;border-radius:50%;border:3px solid #7c3aed;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:14;animation:rippleOut .5s ease-out forwards}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}

/* choice buttons — big, spatially matched left/right, always available */
#choices{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:20;
  display:grid;grid-template-columns:88px 88px 88px;grid-template-rows:76px 76px 76px;gap:8px;
}
.choice-btn{border:3px solid rgba(124,58,237,.5);background:rgba(124,58,237,.08);border-radius:16px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .08s}
.choice-btn .arrow-glyph{font-size:1.9rem;line-height:1}
.choice-btn:active{background:rgba(124,58,237,.35);transform:scale(.94)}
#slot0{grid-column:2;grid-row:1}
#slot1{grid-column:1;grid-row:2}
#slot2{grid-column:3;grid-row:2}
#slot3{grid-column:2;grid-row:3}

#controls{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:8px 16px 10px;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}
.ctrl-btn{height:40px;flex:0 1 170px;max-width:200px;border:2px solid rgba(124,58,237,.5);background:rgba(0,0,0,.4);border-radius:10px;color:#fff;font-size:.85rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}

#screen-intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#140800 0%,#000 70%);padding:20px 16px 24px;text-align:center;overflow-y:auto;box-sizing:border-box}
.intro-content{width:100%;display:flex;flex-direction:column;align-items:center}
.vrr-logo{font-size:2.1rem;font-weight:900;font-style:italic;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 0 60px rgba(255,107,53,1);margin-bottom:6px}
.vrr-logo span{color:#FF6B35}
.vrr-sub{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:#FF6B35;margin-bottom:28px}
.rule-t{font-size:.9rem;color:#cbd5e1;line-height:1.5;max-width:440px;margin-bottom:26px}
.name-input{
  width:100%;max-width:400px;padding:16px;border-radius:14px;border:2px solid rgba(255,107,53,.4);
  background:rgba(255,255,255,.06);color:#fff;font-size:1.2rem;font-weight:900;
  letter-spacing:.02em;text-align:center;font-family:Arial,sans-serif;margin-bottom:16px;
}
.name-input:focus{outline:none;border-color:#FF6B35;box-shadow:0 0 24px rgba(255,107,53,.35)}
.standings-row{font-size:.8rem;color:#9fb3c8;padding:10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px;cursor:pointer}
.standings-row:last-child{border-bottom:none}
.standings-row:active{background:rgba(255,107,53,.08)}
.standings-rank{font-weight:900;font-size:1.05rem;color:#FF6B35;min-width:28px}
.standings-row.rank-1 .standings-rank{color:#ffd35a}
.standings-row.rank-2 .standings-rank{color:#c4b5fd}
.standings-row.rank-3 .standings-rank{color:#fb923c}
.standings-name{flex:1;color:#fff;font-weight:700;text-align:left}
.standings-pts{color:#00e5ff;font-weight:900;font-size:1rem}
.standings-bpm{color:#9fb3c8;font-size:.72rem;min-width:64px;text-align:right}
.rule-t b{color:#fff}
.big-btn{width:100%;max-width:420px;height:68px;border:none;border-radius:20px;background:linear-gradient(135deg,#FF6B35,#ff8a5c);color:#fff;font-size:1.2rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 40px rgba(255,107,53,.7);margin-bottom:14px}
@keyframes btnPulse{0%,100%{box-shadow:0 0 40px rgba(124,58,237,.7)}50%{box-shadow:0 0 80px rgba(124,58,237,1)}}
#screen-intro::before{content:'';position:fixed;top:0;left:0;right:0;height:90px;background:#000;z-index:55;pointer-events:none}
.intro-back{position:fixed;top:16px;left:16px;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;text-decoration:none;z-index:60}
.intro-fs{position:fixed;top:60px;right:16px;padding:8px 16px;border:2px solid rgba(0,206,209,.4);background:rgba(0,0,0,.5);color:#00CED1;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;cursor:pointer;z-index:60}
@media(max-width:768px){.intro-fs{display:none}}
.best-line{margin-top:18px;font-size:.85rem;color:#9fb3c8}
.best-line b{color:#FF6B35}

#screen-end{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;padding:20px}

#screen-box{position:fixed;inset:0;z-index:58;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;padding:24px;overflow-y:auto}
.box-title{font-size:1.7rem;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 40px rgba(255,140,0,.8);margin-bottom:2px}
.box-title span{color:#00e5ff}
.box-sub{font-size:.65rem;letter-spacing:.24em;text-transform:uppercase;color:#FF6B35;margin-bottom:22px}
/* Landscape layout — a wide, two-column grid rather than one long
   narrow strip stacking straight down. In VR especially, a page that
   spreads sideways within the comfortable field of view beats one
   that demands scrolling far down to reach everything. Last Game
   (which can grow tall on its own, since its tap log covers a full
   game) gets its own column; Career and Recent Games — both more
   compact and predictable in height — share the other. */
.box-grid{width:100%;max-width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.box-section{width:100%;margin-bottom:24px}
.box-section-label{font-size:.65rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#ffd35a;margin-bottom:8px;text-align:left;padding-left:4px}
.box-table{width:100%;border-collapse:collapse;background:rgba(255,107,53,.06);border:1px solid rgba(255,107,53,.3);border-radius:12px;overflow:hidden}
.box-table th{background:rgba(255,107,53,.18);color:#a78bfa;font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;text-align:center;border-bottom:1px solid rgba(255,107,53,.3)}
.box-table td{padding:12px 6px;text-align:center;font-weight:900;font-size:1.1rem;color:#fff}
.box-table .box-pts{color:#00e5ff;font-size:1.4rem}
.box-empty{color:#7fa8c0;font-size:.85rem;padding:24px 8px;font-style:italic}
.box-back-btn{width:100%;max-width:440px;height:56px;border:none;border-radius:16px;background:linear-gradient(135deg,#FF6B35,#ff8a5c);color:#fff;font-size:1rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(255,107,53,.6);margin-top:6px}
.box-lang-toggle{position:fixed;top:16px;right:16px;display:flex;gap:6px;z-index:60}
.box-lang-btn{padding:7px 14px;border:1px solid rgba(255,107,53,.4);background:transparent;color:#9fb3c8;border-radius:8px;font-size:.72rem;font-weight:900;letter-spacing:.06em;cursor:pointer}
.box-lang-btn.active{border-color:#FF6B35;color:#fff;background:rgba(255,107,53,.18)}
.box-recent-row{font-size:.75rem;color:#9fb3c8;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;padding:8px 10px;cursor:pointer}
.box-recent-row:hover{background:rgba(255,107,53,.08)}
.box-recent-row .expand-hint{color:#FF6B35;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;margin-left:8px}
/* Tap-by-tap — the full, ordered history of a single game, not just
   its summary numbers. A real reference point for how the total
   points actually built up, hit by hit. */
/* A real timeline, not a wrapped grid — each tap recedes a little
   further into the distance than the one before it, curving gently
   up and away, shrinking and fading as it goes. The same depth
   language as the two-column layout, applied to a single game's own
   sequence of taps, so a full game reads as a path you look down
   rather than a spreadsheet row. */
.tap-log{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:rgba(255,107,53,.05);border:1px solid rgba(255,107,53,.25);border-radius:12px;margin-top:8px}
.tap-chip{flex:0 0 auto;min-width:44px;padding:4px 6px;border-radius:7px;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:.62rem;font-weight:900;line-height:1.3}
.tap-chip.hit{background:rgba(255,107,53,.22);border:1px solid rgba(255,107,53,.5);color:#c4b5fd}
.tap-chip.miss{background:rgba(255,20,147,.16);border:1px solid rgba(255,20,147,.4);color:#ff8fb8}
.tap-chip .tap-bpm{display:block;font-size:.68rem}
.tap-chip .tap-pts{display:block;opacity:.85;font-size:.58rem;margin-top:1px}
.tap-log-total{width:100%;text-align:center;margin-top:0;padding:8px 14px 14px;border-top:1px solid rgba(255,107,53,.25);font-size:.85rem;font-weight:900;color:#fff}
.tap-log-total b{color:#00e5ff;font-size:1.1rem}
.tap-log-empty{color:#7fa8c0;font-size:.75rem;font-style:italic;padding:8px}
.box-recent-row:last-child{border-bottom:none}
.box-recent-row b{color:#ffd35a}
.box-open-btn{width:100%;max-width:420px;height:52px;border:2px solid rgba(0,229,255,.5);background:rgba(0,229,255,.1);border-radius:14px;color:#00e5ff;font-size:.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px}

/* Game switcher — every game's start screen carries the same 4-slot
   row, so any game (and its own standings, one tap further in) is
   reachable from any other game without a hub in between. Slots for
   games not yet built stay visibly present but disabled — an honest
   "coming soon", not a broken link. */
.game-switcher{display:flex;gap:8px;max-width:420px;width:100%;margin:18px auto 0}
.switcher-btn{flex:1;padding:10px 4px;border-radius:12px;text-decoration:none;text-align:center;font-size:.62rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;line-height:1.3}
.switcher-btn.game-active{border:2px solid rgba(255,107,53,.5);background:rgba(255,107,53,.12);color:#ffb38a}
.switcher-btn.game-current{border:2px solid rgba(255,107,53,.8);background:rgba(255,107,53,.28);color:#fff}
.switcher-btn.game-soon{border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#4a5058;cursor:default}
.final-num{font-size:6rem;font-weight:900;color:#FF6B35;line-height:1;text-shadow:0 0 60px rgba(255,107,53,.9)}
.final-label{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#9fb3c8;margin-top:10px}
.final-bpm-big{font-size:1.8rem;font-weight:900;color:#ffd35a;margin-top:10px}
.final-acc{margin-top:6px;font-size:1.1rem;color:#ffd35a;font-weight:900}
.final-misses{margin-top:10px;font-size:1.3rem;font-weight:900;color:#FF1493;text-shadow:0 0 20px rgba(255,20,147,.5)}
.final-misses.clean{color:#00D9A5;text-shadow:0 0 20px rgba(0,217,165,.5)}
#screen-end h2{font-size:1.8rem;font-weight:900;margin:24px 0 8px}
#endSub{font-size:.9rem;color:#9fb3c8;line-height:1.6;max-width:400px}
.next-player-btn{margin-top:28px;height:64px;padding:0 40px;border:none;border-radius:16px;background:linear-gradient(120deg,#FF6B35,#ff8a5c);color:#fff;font-size:1.15rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(255,107,53,.6)}
.session-line{margin-top:22px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#7fa8c0}

#countdown{position:fixed;inset:0;z-index:56;display:none;align-items:center;justify-content:center;background:#000}
#bigCount{font-size:8rem;font-weight:900;color:#7c3aed;text-shadow:0 0 60px rgba(124,58,237,.9)}
@media(max-width:420px){.vrr-logo{font-size:1.5rem}.big-btn{height:60px;font-size:1.1rem}
  #choices{grid-template-columns:70px 70px 70px;grid-template-rows:62px 62px 62px;gap:6px}
  .choice-btn .arrow-glyph{font-size:1.5rem}
}
</style>
</head>
<body>
<div id="space">
  <canvas id="stars"></canvas>
  <div id="edge-glow"></div>
  <div id="flash"></div>
</div>

<div id="topClock">
  <div class="clock-label">Time Left</div>
  <div class="clock-val" id="hClock">1:00</div>
</div>

<div id="hud">
  <div class="hud-box"><div class="hud-label">Score</div><div class="hud-val" id="hScore">0</div></div>
  <div class="hud-box"><div class="hud-label">Last</div><div class="hud-val" id="hLastMs">--</div></div>
  <div class="hud-box"><div class="hud-label">Best</div><div class="hud-val" id="hBest">0</div></div>
</div>

<div id="msg" class="watch"></div>
<div id="stage"><div id="stimulus"></div></div>

<div id="choices">
  <button class="choice-btn" id="slot0"><span class="arrow-glyph"></span></button>
  <button class="choice-btn" id="slot1"><span class="arrow-glyph"></span></button>
  <button class="choice-btn" id="slot2"><span class="arrow-glyph"></span></button>
  <button class="choice-btn" id="slot3"><span class="arrow-glyph"></span></button>
</div>

<div id="controls">
  <button class="ctrl-btn" id="fsBtnGame">⛶ Full Screen</button>
</div>

<!-- INTRO -->
<div id="screen-intro">
  <a class="intro-back" href="index.html">← Back</a>
  <button class="intro-fs" id="fsBtn" data-i18n="fullscreen">⛶ Fullscreen</button>
  <div class="box-lang-toggle">
    <button class="box-lang-btn active" id="introLangEN">EN</button>
    <button class="box-lang-btn" id="introLangES">ES</button>
  </div>
  <div class="intro-content">
  <div class="vrr-logo">SHOOT IT. <span>OWN IT.</span></div>
  <input type="text" id="playerNameInputMain" class="name-input" maxlength="20" placeholder="Your name" autocomplete="off" style="max-width:320px;margin:8px auto">
  <button class="big-btn" id="bigStart" data-i18n="start" onclick="handleStartClick()">▶ ENTER THE GAMEBOARD</button>
  <a class="box-open-btn" href="dynamic-basketball-standings.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">🏆 THE STANDINGS</a>
  <div class="game-switcher">
    <span class="switcher-btn game-current">1<br>Shoot It.</span>
    <a class="switcher-btn game-active" href="vr-make-it-count.html">2<br>Make It</a>
  </div>
  <div style="margin-top:24px;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4a5058">Powered by <a href="https://hooporia.com" target="_blank" rel="noopener" style="color:#8892a0;font-style:italic;text-decoration:underline">Gostar Digital</a></div>
  </div>
</div>

<!-- THE STANDINGS -->
<div id="screen-box">
  <button class="box-back-btn" id="closeBoxBtn" style="margin-top:0;margin-bottom:20px">← Back</button>
  <div class="box-title">THE <span>STANDINGS</span></div>
  <div class="box-sub">Shoot It. Own It. · Player vs. Player</div>

  <div style="width:100%;max-width:600px">
    <div class="box-section">
      <div class="box-section-label">Standings — Best Score Per Player</div>
      <div class="box-table" id="standingsList" style="border-radius:12px"></div>
      <div class="tap-log" id="standingsTapLog" style="display:none"></div>
      </div>
    </div>
  </div>

<!-- COUNTDOWN -->
<div id="countdown"><div id="bigCount">3</div></div>

<!-- END -->
<div id="screen-end">
  <div class="final-num" id="endNum">0</div>
  <div class="final-label">Total Points</div>
  <button class="next-player-btn" id="nextPlayerBtn">← Back</button>
  <a href="vr-make-it-count.html" onclick="sessionStorage.setItem('db-carryover-name',currentPlayerName)" style="display:block;margin-top:12px;max-width:280px;margin-left:auto;margin-right:auto;text-decoration:none;text-align:center;padding:14px 24px;border-radius:100px;background:linear-gradient(135deg,#00e5ff,#FF6B35);color:#0a0a12;font-weight:900;letter-spacing:1px;font-size:.95rem">▶ NEXT GAME</a>
  <a class="box-open-btn" href="dynamic-basketball-standings.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:12px">🏆 THE STANDINGS</a>
</div>

<script>
var FLASH_BPM=180; // settled on through real testing — the one speed that works
function getFlashMs(){return Math.round(60000/FLASH_BPM)}
var PACE_MS=600;
var CONTEST_MS=60000; // how many threes can you make in a minute —
// the clock is the only thing that ends this format, not a round count.
var BEST_KEY='vr-shoot-it-own-it-best';
var BEST_MS_KEY='vr-shoot-it-own-it-best-ms';

function $(id){return document.getElementById(id)}

// Translations for the intro screen only — the title "Shoot It. Own It."
// stays as-is in both languages, since it's a brand name, not a
// description, same as "Lights Out" and "Flash Basketball" elsewhere.
var INTRO_I18N={
  en:{
    fullscreen:'⛶ Fullscreen',
    subtitle:'Flash Basketball VR · Flash & Recall',
    rules:'<b>60 seconds.</b> A basketball flashes once, at a new spot each time, carrying an arrow. Then it\'s gone — read it, remember it, and tap the matching Swish Shot whenever you\'re ready. Every make is scored on real speed — the faster you are, the more points you earn. A wrong shot or no response at all earns nothing, but costs you nothing either. How many points can you rack up before the clock runs out?',
    start:'▶ ENTER THE GAMEBOARD',
    standingsBtn:'🏆 THE STANDINGS'
  },
  es:{
    fullscreen:'⛶ Pantalla Completa',
    subtitle:'Flash Basketball VR · Destello y Recuerda',
    rules:'<b>60 segundos.</b> Un balón de baloncesto destella una vez, en un lugar nuevo cada vez, mostrando una flecha. Luego desaparece — léela, recuérdala, y toca el Swish Shot correcto cuando estés listo. Cada acierto se puntúa según tu velocidad real — mientras más rápido seas, más puntos ganas. Un tiro equivocado o ninguna respuesta no gana nada, pero tampoco te cuesta nada. ¿Cuántos puntos puedes acumular antes de que se acabe el tiempo?',
    start:'▶ EMPEZAR',
    standingsBtn:'🏆 LA CLASIFICACIÓN'
  }
};
var introLang='en';
function applyIntroTranslations(){
  var t=INTRO_I18N[introLang];
  $('fsBtn').textContent=t.fullscreen;
  $('bigStart').textContent=t.start;
}
$('introLangEN').addEventListener('click',function(){
  introLang='en';
  this.classList.add('active');
  $('introLangES').classList.remove('active');
  applyIntroTranslations();
});
$('introLangES').addEventListener('click',function(){
  introLang='es';
  this.classList.add('active');
  $('introLangEN').classList.remove('active');
  applyIntroTranslations();
});

// Name entry — required before every turn, since standings only mean
// something if every score is honestly attributed to a real player.
var currentPlayerName='';
// Start reads the name directly from the input sitting right on the
// intro screen and launches straight into the game — no separate
// name-entry screen to transition through first. One fewer screen
// swap is one fewer chance for a VR browser's layout to misbehave.
function handleStartClick(){
  var nameField=$('playerNameInputMain');
  var name=nameField.value.trim();
  if(!name){
    nameField.focus();
    nameField.style.borderColor='#ff1e3c';
    setTimeout(function(){nameField.style.borderColor=''},600);
    return;
  }
  currentPlayerName=name.slice(0,20);
  startDrill();
}
$('playerNameInputMain').addEventListener('keydown',function(e){
  if(e.key==='Enter')handleStartClick();
});

// Arriving here via "Next Game" from another game in the chain — the
// name they already typed once carries over, so they're not asked to
// type it again for what's really the same session, just a different
// drill. Read once, then cleared, so it never lingers into a later,
// unrelated visit to this same page.
(function(){
  var carried=sessionStorage.getItem('db-carryover-name');
  if(carried){
    $('playerNameInputMain').value=carried;
    currentPlayerName=carried;
    sessionStorage.removeItem('db-carryover-name');
  }
})();

var phase='idle';
var idx=0,score=0,best=0,correctCount=0,totalRT=0,rtCount=0,bestAvgMs=0,misses=0;
var shotLog=[]; // the full, ordered history of every tap this game —
// hit or miss, with the exact BPM and points each one earned. This is
// what makes the Box Score's tap-by-tap view possible, not just the
// final summary numbers.
var timers=[],tapLocked=false,shownAt=0,currentSide=null,awaitingResponse=false;
var sessionBest=0, playersThisSession=0;
var stimulus=$('stimulus'),stage=$('stage');

function loadBest(){
  best=0;
  try{best=parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0}catch(e){}
  try{bestAvgMs=parseInt(localStorage.getItem(BEST_MS_KEY)||'0',10)||0}catch(e){bestAvgMs=0}
  $('hBest').textContent=best;
}
function saveBest(){try{localStorage.setItem(BEST_KEY,String(best))}catch(e){}}
function saveBestMs(){try{localStorage.setItem(BEST_MS_KEY,String(bestAvgMs))}catch(e){}}

// THE STANDINGS — a shared board combining every headset in the
// room, not just this one device. Every finished game is inserted as
// its own row in Supabase; the app itself groups by player name and
// keeps each player's best score when building the ranked view. A
// dropped connection never blocks a player from seeing their own
// result — it just means that one score won't reach the shared board
// until the network comes back.
var SB_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var SB_TABLE='vr_shoot_it_own_it_standings';

function recordScoreToStandings(name,finalScore,made,attempts,avgMs,shots){
  return fetch(SB_URL+'/rest/v1/'+SB_TABLE,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({player_name:name,score:finalScore,made:made,attempts:attempts,avg_ms:avgMs,shots:shots||[]})
  }).catch(function(){}); // offline is fine — this game's own end screen already shows the score either way
}

// Fetches every game ever recorded, then keeps only each player's own
// best — the same "best score per player" logic the local-only
// version always used, just built from shared data now instead of
// one device's own storage.
function fetchStandings(){
  var url=SB_URL+'/rest/v1/'+SB_TABLE+'?select=player_name,score,made,attempts,avg_ms,shots&order=score.desc';
  return fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(function(r){if(!r.ok)throw new Error('bad response');return r.json()})
    .then(function(rows){
      var best={};
      (rows||[]).forEach(function(r){
        var existing=best[r.player_name];
        if(!existing||r.score>existing.pts){
          best[r.player_name]={name:r.player_name,pts:r.score,made:r.made,attempts:r.attempts,ms:r.avg_ms,shots:r.shots||[]};
        }
      });
      return Object.keys(best).map(function(n){return best[n]}).sort(function(a,b){return b.pts-a.pts});
    });
}

// The board is now only cleared from admin.html, behind a real
// login — never from a button any player could reach on a shared
// classroom device.


// Renders one game's full tap-by-tap history into a container — a
// real, ordered record of every hit and miss with its own BPM and
// point value, plus the game's actual final total, so someone can see
// exactly how that number was built, not just what it added up to.
function renderTapLog(container,shots,finalScore){
  if(!shots||!shots.length){
    container.innerHTML='<div class="tap-log-empty">No tap-by-tap detail saved for this game.</div>';
    return;
  }
  var chips=shots.map(function(s){
    if(s.hit){
      return '<div class="tap-chip hit"><span class="tap-bpm">'+s.bpm+' BPM</span><span class="tap-pts">+'+s.pts+'</span></div>';
    }
    var label=s.noResponse?'NO RESP':(s.bpm>0?s.bpm+' BPM':'MISS');
    return '<div class="tap-chip miss"><span class="tap-bpm">'+label+'</span><span class="tap-pts">'+s.pts+'</span></div>';
  }).join('');
  container.innerHTML=chips+'<div class="tap-log-total">Final Total: <b>'+finalScore+' PTS</b></div>';
}

function renderStandings(){
  // The ranked board is shared across every device, so it genuinely
  // has to wait on a real fetch. Show that honestly rather than
  // pretending it's instant.
  var listEl=$('standingsList');
  var tapLogEl=$('standingsTapLog');
  tapLogEl.style.display='none';
  listEl.innerHTML='<div class="box-empty">Loading standings…</div>';

  fetchStandings().then(function(ranked){
    var openRowName=null;
    if(!ranked.length){
      listEl.innerHTML='<div class="box-empty">No players yet — be the first name on the board.</div>';
      return;
    }
    listEl.innerHTML=ranked.map(function(p,i){
      var rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
      var safeName=p.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return '<div class="standings-row '+rankClass+'" data-name="'+safeName+'">'
        +'<span class="standings-rank">'+(i+1)+'</span>'
        +'<span class="standings-name">'+safeName+'</span>'
        +'<span class="standings-bpm">'+(p.ms>0?bpmFromMs(p.ms)+' BPM':'')+'</span>'
        +'<span class="standings-pts">'+p.pts+'</span>'
        +'</div>';
    }).join('');
    listEl.querySelectorAll('.standings-row').forEach(function(row){
      row.addEventListener('click',function(){
        var name=row.dataset.name;
        if(openRowName===name){
          tapLogEl.style.display='none';
          openRowName=null;
          return;
        }
        openRowName=name;
        var p=ranked.find(function(r){return r.name===name});
        renderTapLog(tapLogEl,p.shots,p.pts);
        tapLogEl.style.display='flex';
        row.insertAdjacentElement('afterend',tapLogEl);
      });
    });
  }).catch(function(){
    // A genuinely dropped connection — the player's own game is
    // completely unaffected, only the shared board couldn't load.
    listEl.innerHTML='<div class="box-empty">Couldn\'t reach the standings — check the connection. <span id="standingsRetryBtn" style="color:#FF6B35;text-decoration:underline;cursor:pointer">Try again</span></div>';
    var retryBtn=document.getElementById('standingsRetryBtn');
    if(retryBtn)retryBtn.addEventListener('click',function(){renderStandings()});
  });
}

// The intro screen's own Standings button is gone — this game's
// standings are now only reached from the shared hub, which links
// here with ?standings=1. Caught on load, before the player ever
// sees the intro screen at all.
if(new URLSearchParams(window.location.search).get('standings')==='1'){
  renderStandings();
  $('screen-intro').style.display='none';
  $('screen-box').style.display='flex';
}
$('closeBoxBtn').onclick=function(){
  window.location.href='dynamic-basketball-standings.html';
};

var fsb=$('fsBtn');
if(fsb)fsb.onclick=async function(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
var fsg=$('fsBtnGame');
if(fsg)fsg.onclick=async function(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};

(function(){
  var c=$('stars'),ctx=c.getContext('2d'),stars=[];
  function size(){c.width=innerWidth;c.height=innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<150;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.3,o:Math.random()*.6+.1,s:Math.random()*.5+.2});
  (function draw(){ctx.clearRect(0,0,c.width,c.height);var t=Date.now()/1000;stars.forEach(function(s){var p=s.o+Math.sin(t*s.s)*.13;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fillStyle='rgba(255,255,255,'+Math.max(0,Math.min(1,p))+')';ctx.fill()});requestAnimationFrame(draw)})();
})();

function msg(t,c){var e=$('msg');e.textContent=t;e.className=c||'watch'}
function clrT(){timers.forEach(clearTimeout);timers=[]}
function bpmFromMs(v){return v?Math.round(60000/v):0}
function ripple(x,y){var r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';r.style.width='50px';r.style.height='50px';document.body.appendChild(r);setTimeout(function(){r.remove()},520)}
function flash(color){var f=$('flash');f.style.background=color;f.style.opacity='1';setTimeout(function(){f.style.opacity='0'},100)}

function startDrill(){
  if(phase==='running')return;
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); } }catch(e){}
  $('screen-intro').style.display='none';
  $('countdown').style.display='flex';
  var n=3;$('bigCount').textContent=n;
  var iv=setInterval(function(){
    n--;
    if(n<=0){clearInterval(iv);$('countdown').style.display='none';runDrill()}
    else{$('bigCount').textContent=n}
  },800);
}

var contestTimerInterval=null,contestEndAt=0;
function runDrill(){
  phase='running';idx=0;score=0;correctCount=0;totalRT=0;rtCount=0;misses=0;shotLog=[];
  $('hScore').textContent='0';$('hLastMs').textContent='--';
  msg('GET READY...','go');

  contestEndAt=performance.now()+CONTEST_MS;
  updateContestClock();
  clearInterval(contestTimerInterval);
  contestTimerInterval=setInterval(function(){
    updateContestClock();
    if(performance.now()>=contestEndAt){
      clearInterval(contestTimerInterval);
      endDrill();
    }
  },100);

  timers.push(setTimeout(function(){msg('','go');nextTrial()},900));
}
function updateContestClock(){
  var remainMs=Math.max(0,contestEndAt-performance.now());
  var totalSec=Math.ceil(remainMs/1000);
  var m=Math.floor(totalSec/60);
  var s=totalSec%60;
  var el=$('hClock');
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.className='clock-val'+(totalSec<=10?' urgent':'');
}

function randomStagePos(){
  var stageRect=stage.getBoundingClientRect();
  var pad=70;
  var x=pad+Math.random()*(stageRect.width-pad*2);
  var y=pad+Math.random()*(stageRect.height-pad*2);
  return {x:x,y:y};
}

var ARROWS={left:'◀',right:'▶',up:'▲',down:'▼'};
var DIRS=['left','right','up','down'];
var noResponseTimer=null;

function nextTrial(){
  if(phase!=='running')return;
  currentSide=DIRS[Math.floor(Math.random()*DIRS.length)];
  stimulus.textContent=ARROWS[currentSide];
  var pos=randomStagePos();
  stimulus.style.left=pos.x+'px';
  stimulus.style.top=pos.y+'px';
  stimulus.classList.add('visible');
  shownAt=performance.now();
  awaitingResponse=true;
  shuffleButtonLayout();

  // A single flash, one beat at 120 BPM, no wandering — then it's gone
  // and the screen goes blank while the response is still fully live.
  // Tapping is valid the whole time, both during the brief flash and
  // through the blank screen after — this is deliberately not "you had
  // to catch it while visible," it's "you saw it, now respond."
  timers.push(setTimeout(function(){
    stimulus.classList.remove('visible');
  },getFlashMs()));

  // Same protection as the other reaction drills — no per-tap deadline,
  // but 5 real seconds of total silence on one target ends the drill.
  stopNoResponseTimer();
  noResponseTimer=setTimeout(handleNoResponse,5000);
}
function stopNoResponseTimer(){if(noResponseTimer){clearTimeout(noResponseTimer);noResponseTimer=null}}

// Re-randomizes which direction lives in which of the four fixed
// screen positions, every single round. The physical slots never
// move — the cross stays a cross, predictable to reach — but which
// arrow is IN each slot changes every time, so there's no "top button
// = up" muscle memory to fall back on. Reading both the target and
// the buttons is required on every single tap.
var SLOT_IDS=['slot0','slot1','slot2','slot3'];
function shuffleButtonLayout(){
  var shuffled=DIRS.slice();
  for(var i=shuffled.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=tmp;
  }
  SLOT_IDS.forEach(function(slotId,i){
    var dir=shuffled[i];
    var btn=$(slotId);
    btn.dataset.dir=dir;
    btn.querySelector('.arrow-glyph').textContent=ARROWS[dir];
  });
}

function handleNoResponse(){
  if(phase!=='running')return;
  if(!awaitingResponse)return;
  awaitingResponse=false;
  stimulus.classList.remove('visible');
  idx++;
  misses++;
  shotLog.push({hit:false,bpm:0,pts:0,noResponse:true});
  flash('rgba(255,20,147,.28)');
  msg('✗ NO RESPONSE (0 PTS)','wrong');
  $('hScore').textContent=Math.max(0,score);
  advanceOrEnd();
}

function advanceOrEnd(){
  timers.push(setTimeout(function(){
    if(phase==='running')msg('','go');
    nextTrial();
  },PACE_MS));
}

function handleChoice(side){
  if(phase!=='running')return;
  if(!awaitingResponse)return;
  if(tapLocked)return;
  tapLocked=true;setTimeout(function(){tapLocked=false},40);

  stopNoResponseTimer();
  awaitingResponse=false;
  var rt=performance.now()-shownAt;
  var isCorrect=(side===currentSide);
  var dotRect=stimulus.getBoundingClientRect();
  var rx=dotRect.left+dotRect.width/2, ry=dotRect.top+dotRect.height/2;
  stimulus.classList.remove('visible');

  idx++;
  totalRT+=rt;rtCount++;

  if(isCorrect){
    correctCount++;
    // Speed-sensitive scoring: 300 points at an instant tap, decaying
    // down to exactly 1 point at 30 BPM (2000ms) — the floor now sits
    // at a genuinely slow pace, not one that was cutting off anyone
    // slower than 50 BPM to a flat 1 point.
    var tapPts=Math.max(1,Math.round(300-rt/6.689));
    score+=tapPts;
    shotLog.push({hit:true,bpm:bpmFromMs(rt),pts:tapPts});
    ripple(rx,ry);flash('rgba(124,58,237,.14)');
    $('hLastMs').textContent=bpmFromMs(rt);
    msg(bpmFromMs(rt)+' BPM · +'+tapPts+' PTS','correct');
  }else{
    misses++;
    shotLog.push({hit:false,bpm:bpmFromMs(rt),pts:0,noResponse:false});
    flash('rgba(255,20,147,.28)');
    $('hLastMs').textContent='MISS';
    msg('✗ MISS! (0 PTS)','wrong');
  }

  $('hScore').textContent=Math.max(0,score);

  advanceOrEnd();
}

// Each slot's own click handler reads whichever direction is CURRENTLY
// assigned to it at the moment of the tap, rather than a fixed
// direction baked into the button itself — since that assignment
// changes every round.
['slot0','slot1','slot2','slot3'].forEach(function(id){
  $(id).addEventListener('pointerdown',function(e){
    e.preventDefault();
    handleChoice(this.dataset.dir);
  });
});

function endDrill(){
  if(phase==='done')return;
  // If the clock runs out while a target is still actively on screen
  // awaiting a response, that round must never just vanish from the
  // tally — the player saw it and didn't get to respond in time,
  // which is a real miss, exactly like any other no-response. Count
  // it before finalizing anything else.
  if(awaitingResponse){
    awaitingResponse=false;
    idx++;
    misses++;
    shotLog.push({hit:false,bpm:0,pts:0,noResponse:true});
  }
  phase='done';clrT();clearInterval(contestTimerInterval);stopNoResponseTimer();stimulus.classList.remove('visible');
  var finalScore=Math.max(0,score);
  var avgRT=rtCount?Math.round(totalRT/rtCount):0;
  var accPct=idx>0?Math.round((correctCount/idx)*100):0;
  var isNewPts=finalScore>best;
  var isNewMs=avgRT>0&&(bestAvgMs===0||avgRT<bestAvgMs);
  if(isNewPts){best=finalScore;saveBest()}
  if(isNewMs){bestAvgMs=avgRT;saveBestMs()}

  // The final buzzer — a real horn sound plus a screen shake, exactly
  // the dramatic "time's up" moment a real game clock running out
  // actually delivers. The end screen itself waits a beat behind it,
  // so the buzzer moment gets to land before the numbers show up.
  playBuzzer();
  document.body.classList.add('buzzer-shake');
  var f=$('flash');
  f.classList.add('buzzer');
  f.style.background='rgba(255,211,90,.5)';
  f.style.opacity='1';
  setTimeout(function(){f.style.opacity='0'},250);
  setTimeout(function(){document.body.classList.remove('buzzer-shake');f.classList.remove('buzzer')},1000);

  $('endNum').textContent=finalScore;

  recordScoreToStandings(currentPlayerName,finalScore,correctCount,idx,avgRT,shotLog);

  timers.push(setTimeout(function(){
    $('screen-end').style.display='flex';
  },500));
}

function nextPlayer(){
  $('screen-end').style.display='none';
  $('screen-intro').style.display='flex';
  $('playerNameInputMain').value=currentPlayerName; // last name typed stays prefilled, since the same player often plays several turns in a row
  setTimeout(function(){$('playerNameInputMain').focus()},50);
}
$('nextPlayerBtn').onclick=nextPlayer;

var lastAvgBpm=0;
var beatAudioCtx=null;
function getBeatAC(){if(!beatAudioCtx){try{beatAudioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return beatAudioCtx}

// The final buzzer — a real, harsh sustained horn tone.
function playBuzzer(){
  var c=getBeatAC();if(!c)return;
  try{
    if(c.state==='suspended')c.resume();
    var o=c.createOscillator(),g=c.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(220,c.currentTime);
    g.gain.setValueAtTime(0.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.55,c.currentTime+0.05);
    g.gain.setValueAtTime(0.55,c.currentTime+1.1);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+1.4);
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+1.45);

    var o2=c.createOscillator(),g2=c.createGain();
    o2.type='square';
    o2.frequency.setValueAtTime(221,c.currentTime);
    g2.gain.setValueAtTime(0.001,c.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.28,c.currentTime+0.05);
    g2.gain.setValueAtTime(0.28,c.currentTime+1.1);
    g2.gain.exponentialRampToValueAtTime(0.001,c.currentTime+1.4);
    o2.connect(g2);g2.connect(c.destination);
    o2.start();o2.stop(c.currentTime+1.45);
  }catch(e){}
}

loadBest();

// Opened directly from the hub's own "Standings" link for this game
// goes straight to the shared board instead of the intro screen.
// Otherwise, the intro screen (which now carries the name input
// directly) is already visible by default — nothing else to do.
if(new URLSearchParams(window.location.search).get('standings')==='1'){
  renderStandings();
  $('screen-intro').style.display='none';
  $('screen-box').style.display='flex';
}
</script>
